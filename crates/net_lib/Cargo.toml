[package]
name = "net_lib"
version = "0.1.0"
edition = "2024"
description = "A small and simple networking wrapper crate."
license = "MIT"

[features]
default = ["full"]
full = ["tcp", "udp"]

tcp = []
udp = []

[dependencies]
bytes = "1.12.1"
postcard = { workspace = true, features = ["use-std"] }
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[lints]
workspace = true
